name: CI/CD Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: CI - Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install packages
        run: npm ci

      - name: Run backend tests
        run: npm test

  frontend:
    name: CI - Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install packages
        run: npm ci

      - name: Lint the frontend
        run: npm run lint

      - name: Build the frontend
        run: npm run build

  delivery:
    name: CD - Build, Scan, Push
    runs-on: ubuntu-latest

    needs: [backend, frontend]

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Build Docker images
        id: build
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/student"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          docker build \
            -t "$IMAGE-backend:latest" \
            -t "$IMAGE-backend:$GITHUB_SHA" \
            ./backend

          docker build \
            -t "$IMAGE-frontend:latest" \
            -t "$IMAGE-frontend:$GITHUB_SHA" \
            ./frontend

      - name: Scan the backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.image }}-backend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL
          exit-code: '1'

      - name: Scan the frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.image }}-frontend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL
          exit-code: '1'

      - name: Log in to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" \
            --password-stdin

      - name: Push Docker images
        shell: bash
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          docker push "$IMAGE-backend:latest"
          docker push "$IMAGE-backend:$GITHUB_SHA"

          docker push "$IMAGE-frontend:latest"
          docker push "$IMAGE-frontend:$GITHUB_SHA"